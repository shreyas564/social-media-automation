{% extends "affiliate_base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}

<!-- HEADER -->
<div class="row align-items-center py-3 px-3 border-bottom bg-light">
    <div class="col-auto">
        <i class="bi bi-gear-fill fs-4 text-success"></i>
    </div>

    <div class="col">
        <h5 class="mb-0">Settings</h5>
        <small class="text-muted">Manage your affiliate account</small>
    </div>
</div>

<!-- PROFILE CARD -->
<div class="card shadow-sm mt-4 panel-shell" style="border:0">
    <div class="card-body">

        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-person-circle fs-3 text-primary me-3"></i>

            <div>
                <h6 class="mb-0">{{ affiliate.username }}</h6>
                <small class="text-muted">Affiliate Account</small>
            </div>
        </div>

        <hr>

        <!-- SETTINGS OPTIONS -->
        <div class="list-group list-group-flush">

            <!-- EDIT PROFILE -->
            <a href="{% url 'edit_affiliate_profile' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span>
                    <i class="bi bi-pencil-square me-2"></i>
                    Edit Profile
                </span>
                <i class="bi bi-chevron-right"></i>
            </a>

            <!-- CHANGE PASSWORD -->
            <a href="{% url 'change_password_page' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span>
                    <i class="bi bi-lock me-2"></i>
                    Change Password
                </span>
                <i class="bi bi-chevron-right"></i>
            </a>

            <a href="{% url 'user_payment_details' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span>
                    <i class="bi bi-credit-card-2-front me-2"></i>
                    User Payment Details
                </span>
                <i class="bi bi-chevron-right"></i>
            </a>

            <!-- LOGOUT -->
            <a href="{% url 'affiliate_logout' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center text-danger">
                <span>
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Logout
                </span>
                <i class="bi bi-chevron-right"></i>
            </a>

        </div>
    </div>
</div>

{% endblock%}
