<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Affiliate{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --aff-bg: #edf5ef;
      --aff-surface: #ffffff;
      --aff-primary: #1f8d57;
      --aff-primary-2: #166940;
      --aff-text: #10211a;
      --aff-border: #d4e2d8;
      --aff-shadow: 0 12px 30px rgba(17, 54, 34, 0.15);
      --aff-radius: 16px;
    }

    body {
      background:
        radial-gradient(1200px 500px at 0% 0%, rgba(44, 170, 103, 0.16), transparent 50%),
        radial-gradient(900px 400px at 100% 0%, rgba(21, 126, 74, 0.12), transparent 50%),
        var(--aff-bg);
      font-family: "Outfit", sans-serif;
      color: var(--aff-text);
      min-height: 100vh;
    }

    .sidebar {
      height: 100vh;
      background: linear-gradient(180deg, #0f5b3a 0%, #1f8d57 58%, #2ba468 100%);
      color: #fff;
      position: sticky;
      top: 0;
      align-self: flex-start;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 15px 40px rgba(8, 34, 21, 0.35);
      overflow-y: auto;
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 7px;
      transition: all 0.22s ease;
      border: 1px solid transparent;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.22);
      transform: translateX(4px);
    }

    .sidebar a.active-link {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.24);
      font-weight: 600;
    }

    .main-panel {
      padding: 22px;
    }

    .panel-shell {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(212, 226, 216, 0.88);
      border-radius: var(--aff-radius);
      box-shadow: var(--aff-shadow);
      padding: 20px;
      animation: fadeSlideUp 360ms ease both;
    }

    .table tbody tr {
      transition: background 0.18s ease;
    }

    .table tbody tr:hover {
      background: rgba(31, 141, 87, 0.06);
    }

    .btn-primary {
      background: linear-gradient(120deg, var(--aff-primary), #36b777);
      border-color: var(--aff-primary-2);
      box-shadow: 0 8px 18px rgba(31, 141, 87, 0.24);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background: linear-gradient(120deg, var(--aff-primary-2), var(--aff-primary));
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        height: auto;
        position: relative;
      }
      .main-panel {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- AFFILIATE SIDEBAR -->
    <div class="col-md-2 sidebar p-3">
      <h4 class="text-center mb-4">Affiliate</h4>

      <a href="{% url 'affiliate_feed' %}">
        <i class="bi bi-house-door me-2"></i> Feed
      </a>

      <a href="{% url 'affiliate_feed' %}?section=post-details">
        <i class="bi bi-table me-2"></i> Post Details
      </a>

      <a href="{% url 'affiliate_post_stats' %}">
        <i class="bi bi-bar-chart me-2"></i> Post Statistics
      </a>

      <a href="{% url 'affiliate_rewards_settings' %}">
        <i class="bi bi-gift me-2"></i> Rewards Settings
      </a>

      <a href="{% url 'affiliate_withdrawal_page' %}">
        <i class="bi bi-cash-stack me-2"></i> Withdrawal
      </a>

      <a href="{% url 'affiliate_payment_history' %}">
        <i class="bi bi-clock-history me-2"></i> Payment History
      </a>

      <a href="{% url 'user_payment_details' %}">
        <i class="bi bi-credit-card-2-front me-2"></i> User Payment Details
      </a>

      <a href="{% url 'usersettings' %}">
        <i class="bi bi-gear me-2"></i> Settings
      </a>

      <a href="{% url 'affiliate_logout' %}">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </a>
    </div>

    <!-- PAGE CONTENT -->
    <div class="col-md-10 main-panel">
      <div class="panel-shell">
        {% block content %}{% endblock %}
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    const current = window.location.pathname;
    document.querySelectorAll(".sidebar a[href]").forEach((link) => {
      const href = link.getAttribute("href");
      if (!href || href === "#") return;
      if (current === href || current.startsWith(href)) {
        link.classList.add("active-link");
      }
    });
  })();
</script>
</body>
</html>
